<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Новини Гімназії №44 — Facebook</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #f6f8fb;
      color: #20324b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    .page { width: min(1120px, calc(100% - 32px)); margin: 28px auto 48px; }
    .header { text-align: center; margin-bottom: 22px; }
    .eyebrow { color: #5276a0; text-transform: uppercase; font-size: 12px; font-weight: 700; letter-spacing: 0.13em; }
    h1 { font-size: clamp(26px, 4.5vw, 40px); letter-spacing: -0.03em; margin: 10px 0 8px; }
    .subtitle { color: #64748b; font-size: 16px; line-height: 1.5; margin: 0; }
    .feed-shell {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(30, 55, 85, .08);
      padding: clamp(12px, 2.5vw, 28px);
      min-height: 320px;
      overflow: hidden;
    }
    #curator-feed-default-feed-layout { width: 100%; max-width: 100%; min-width: 0; }
    .footer { text-align: center; padding-top: 22px; }
    .facebook-link { color: #215f9e; font-weight: 600; text-decoration: none; }
    .facebook-link:hover { text-decoration: underline; }
    .note { color: #64748b; font-size: 13px; margin-top: 12px; }
    @media (max-width: 580px) { .page { width: min(100% - 20px, 1120px); margin-top: 18px; } .feed-shell { border-radius: 12px; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="eyebrow">Наше шкільне життя</div>
      <h1>Новини Гімназії №44</h1>
      <p class="subtitle">Події, досягнення та щасливі миті нашої гімназії</p>
    </header>
    <section class="feed-shell" aria-label="Стрічка новин гімназії">
      <!-- Curator.io: код стрічки, наданий користувачем -->
      <div id="curator-feed-default-feed-layout"><a href="https://curator.io" target="_blank" rel="noopener noreferrer" class="crt-logo crt-tag">Powered by Curator.io</a></div>
    </section>
    <footer class="footer">
      <a class="facebook-link" href="https://www.facebook.com/Gymnasium.num44" target="_blank" rel="noopener noreferrer">Відкрити сторінку гімназії у Facebook ↗</a>
      <p class="note">Дописи завантажуються зі стрічки Curator.io.</p>
    </footer>
  </main>
  <script type="text/javascript">
    /* curator-feed-default-feed-layout */

      var i,e,d=document,s="script";i=d.createElement("script");i.async=1;i.charset="UTF-8";
      i.src="https://cdn.curator.io/published/d70f8cd3-27ac-46b9-a088-d047cf333224.js";
      e=d.getElementsByTagName(s)[0];e.parentNode.insertBefore(i, e);
    })();
  </script>
</body>
</html>
